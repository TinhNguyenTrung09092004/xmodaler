_BASE_: "cosnet_kaggle.yaml"

# Self-critical (CIDEr) stage. Requires:
#   - a finished XE checkpoint in MODEL.WEIGHTS
#   - mscoco_train_gts.pkl / mscoco_train_cider.pkl (kaggle/prepare_data.py --build-cider)

###################################### DATALOADER ######################################
DATALOADER:
  # original RL config: 4 GPUs x 16. 2 GPUs x 32 keeps the same global batch, but each
  # step also runs beam-free sampling, so drop to 16 if this OOMs on a 16GB T4.
  TRAIN_BATCH_SIZE: 32

######################################### Engine #########################################
ENGINE:
  NAME: 'RLMeanTrainer'

######################################### MODEL #########################################
MODEL:
  WEIGHTS: '/kaggle/working/cosnet_output/cosnet_xe.pth'
  USE_EMA: True
  EMA_DECAY: 0.9999

  BERT:
    HIDDEN_DROPOUT_PROB: 0.1
    INTERMEDIATE_DROP: 0.1
    FFN_DROPOUT_PROB: 0.1
    ATTENTION_PROBS_DROPOUT_PROB: 0.1
    LAYER_DROP: 0.0

  COSNET:
    FILTER_WEIGHT: 0.1
    RECONSTRUCT_WEIGHT: 0.01

####################################### losses #######################################
LOSSES:
  NAMES: ['LabelSmoothing', 'SemComphderLoss']
  LABELSMOOTHING: 0.1

####################################### Optimizer #######################################
SOLVER:
  NAME: 'Adam'
  EPOCH: 60
  BASE_LR: 0.00001

####################################### lr scheduler #######################################
LR_SCHEDULER:
  NAME: 'StepLR'
  STEP_SIZE: 15
  GAMMA: 0.8
