_BASE_: "cosnet_kaggle.yaml"

DATALOADER:
  TRAIN_BATCH_SIZE: 32

ENGINE:
  NAME: 'RLMeanTrainer'

MODEL:
  WEIGHTS: '/kaggle/working/cosnet_output/cosnet_xe.pth'
  USE_EMA: True
  EMA_DECAY: 0.9999

  BERT:
    HIDDEN_DROPOUT_PROB: 0.1
    INTERMEDIATE_DROP: 0.1
    FFN_DROPOUT_PROB: 0.1
    ATTENTION_PROBS_DROPOUT_PROB: 0.1
    LAYER_DROP: 0.0

  COSNET:
    FILTER_WEIGHT: 0.1
    RECONSTRUCT_WEIGHT: 0.01

LOSSES:
  NAMES: ['LabelSmoothing', 'SemComphderLoss']
  LABELSMOOTHING: 0.1

SOLVER:
  NAME: 'Adam'
  EPOCH: 60
  BASE_LR: 0.00001
  FIND_UNUSED_PARAMETERS: True

LR_SCHEDULER:
  NAME: 'StepLR'
  STEP_SIZE: 15
  GAMMA: 0.8
